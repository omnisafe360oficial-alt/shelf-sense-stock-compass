<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 52" fill="none">
  <defs>
    <linearGradient id="shield" x1="24" y1="1" x2="24" y2="51" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#132238"/>
      <stop offset="100%" stop-color="#143550"/>
    </linearGradient>
    <linearGradient id="tbar" x1="0" y1="39" x2="0" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#3ecfb8" stop-opacity="0.60"/>
      <stop offset="100%" stop-color="#3ecfb8"/>
    </linearGradient>
    <linearGradient id="wbar" x1="0" y1="39" x2="0" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="white" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="border" x1="24" y1="1" x2="24" y2="51" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#3ecfb8" stop-opacity="0.90"/>
      <stop offset="60%"  stop-color="#3ecfb8" stop-opacity="0.50"/>
      <stop offset="100%" stop-color="#3ecfb8" stop-opacity="0.30"/>
    </linearGradient>
  </defs>

  <!-- Shield body -->
  <path d="M6,4 L42,4 L42,29 C42,40 24,51 24,51 C24,51 6,40 6,29 Z"
        fill="url(#shield)" stroke="url(#border)" stroke-width="1.1"/>

  <!-- Inner double border -->
  <path d="M9,7 L39,7 L39,28.5 C39,38.5 24,48.2 24,48.2 C24,48.2 9,38.5 9,28.5 Z"
        fill="none" stroke="#3ecfb8" stroke-width="0.55" stroke-opacity="0.25"/>

  <!-- Diamond ornaments -->
  <polygon points="16,8.2 17.5,10.2 16,12.2 14.5,10.2" fill="#3ecfb8" opacity="0.60"/>
  <polygon points="32,8.2 33.5,10.2 32,12.2 30.5,10.2" fill="#3ecfb8" opacity="0.60"/>
  <circle cx="24" cy="10.2" r="0.9" fill="#3ecfb8" opacity="0.30"/>

  <!-- Top separator rule -->
  <line x1="10" y1="14" x2="38" y2="14" stroke="#3ecfb8" stroke-width="0.75" stroke-opacity="0.32"/>

  <!-- Barcode bars -->
  <rect x="12.5" y="31" width="2.3" height="8"  rx="0.65" fill="url(#wbar)"/>
  <rect x="16.1" y="25" width="2.3" height="14" rx="0.65" fill="url(#wbar)"/>
  <rect x="19.7" y="19" width="2.3" height="20" rx="0.65" fill="url(#tbar)"/>
  <rect x="23.3" y="16" width="2.3" height="23" rx="0.65" fill="url(#tbar)"/>
  <rect x="26.9" y="19" width="2.3" height="20" rx="0.65" fill="url(#tbar)"/>
  <rect x="30.5" y="25" width="2.3" height="14" rx="0.65" fill="url(#wbar)"/>
  <rect x="34.1" y="31" width="2.3" height="8"  rx="0.65" fill="url(#wbar)"/>

  <!-- Scan line -->
  <line x1="11.5" y1="30" x2="36.5" y2="30"
        stroke="#3ecfb8" stroke-width="0.5" stroke-opacity="0.18" stroke-dasharray="1.5 1.5"/>

  <!-- Bottom separator rule -->
  <line x1="10" y1="40" x2="38" y2="40" stroke="#3ecfb8" stroke-width="0.75" stroke-opacity="0.32"/>

  <!-- 360 text in base -->
  <text x="24" y="46.5" text-anchor="middle"
        fill="#3ecfb8" font-size="4.8" font-weight="700"
        font-family="Sora, system-ui, sans-serif"
        letter-spacing="0.8" opacity="0.72">360</text>
</svg>
